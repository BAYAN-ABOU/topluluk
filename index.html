<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دليل الجالية العربية في تركيا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F2B28;--surface:#153B37;--surface-2:#1D4B45;--accent:#E8A33D;--accent-soft:#F4C579;--text:#F5F1E8;--muted:#9FB8B3;--line:#2A4D48;--ok:#5FD39A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#FAF7F0;--surface:#FFF;--surface-2:#F1ECDF;--text:#1C2B27;--muted:#5F6E69;--line:#E4DFD1;--accent:#C97A2B;--accent-soft:#A85F1D;--ok:#1E8F5A}}
:root[data-theme="dark"]{--bg:#0F2B28;--surface:#153B37;--text:#F5F1E8}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal',sans-serif;line-height:1.6}
h1,h2,h3,button,.brand{font-family:'Cairo',sans-serif}
button{cursor:pointer}
header{padding:26px 20px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0C231F22,transparent)}
.wrap{max-width:980px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-size:23px;font-weight:800;color:var(--accent-soft);margin:0}
.tag{color:var(--muted);font-size:14px;margin:2px 0 0}
.conn{font-size:12px;color:var(--muted);margin:6px 0 0}
.btn{padding:11px 18px;border-radius:12px;border:1px solid var(--accent);background:transparent;color:var(--accent-soft);font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover,.btn:focus-visible{background:var(--accent);color:#1B2420}
.stats{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}
.stat{flex:1;min-width:100px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.stat b{font-family:'Cairo';font-size:21px;color:var(--accent-soft);display:block}
.stat span{font-size:12.5px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
input,select,textarea{font-family:inherit;font-size:14.5px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.search{flex:1;min-width:200px}.sort{width:auto;min-width:150px}
.lbl{font-size:12px;color:var(--muted);margin:12px 0 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:13.5px;font-family:inherit}
.chip.on{background:var(--accent);border-color:var(--accent);color:#1B2420;font-weight:700}
main{padding:18px 20px 70px}
.count{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:.15s}
.card:hover,.card:focus-visible{border-color:var(--accent);transform:translateY(-2px)}
.ch{display:flex;gap:12px;align-items:center}
.av{width:46px;height:46px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:22px;flex:none}
.nm{font-family:'Cairo';font-weight:700;font-size:16px;margin:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.vf{font-size:11px;color:var(--ok);border:1px solid var(--ok);border-radius:999px;padding:0 7px;font-family:'Tajawal'}
.rl{color:var(--accent-soft);font-size:13.5px;margin:0}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:13px;margin-top:10px}
.stars{color:var(--accent);font-size:13px;margin-top:8px}.stars small{color:var(--muted)}
.fav{position:absolute;top:10px;left:10px;background:none;border:none;font-size:19px;color:var(--muted);line-height:1}
.fav.on{color:#E5566D}
.empty{text-align:center;padding:50px 20px;color:var(--muted);display:none}
.ov{position:fixed;inset:0;background:rgba(8,20,18,.72);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:24px 22px;max-height:88vh;overflow-y:auto}
@media(min-width:600px){.ov{align-items:center}.sheet{border-radius:18px}}
.x{float:left;background:none;border:none;color:var(--muted);font-size:22px}
.sm{margin:14px 0;padding:12px 0;border-block:1px solid var(--line);font-size:14px}
.sm div{display:flex;gap:8px;margin-bottom:6px}.sm b{color:var(--muted);min-width:72px;font-weight:500}
.acts{display:flex;gap:10px;margin-top:14px}
.act{flex:1;text-align:center;padding:12px;border-radius:12px;font-weight:700;font-family:'Cairo';font-size:14.5px;text-decoration:none;border:none}
.wa{background:#25D366;color:#0B2A18}.call{background:var(--surface-2);color:var(--text)}
.act.off{opacity:.45;pointer-events:none}
.note{font-size:12px;color:var(--muted);margin-top:12px}
.form{display:none;max-width:560px;margin:20px auto 50px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.form.open{display:block}.form h2{margin:0 0 4px;font-size:19px}
.f{margin-bottom:12px}.f label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.f2{display:flex;gap:10px}.f2 .f{flex:1}
.go{width:100%;padding:13px;border:none;border-radius:12px;background:var(--accent);color:#1B2420;font-weight:700;font-size:15px}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <div><h1 class="brand">دليل الجالية</h1><p class="tag">أطباء، أساتذة، عقارات، محامون ومطاعم عربية في تركيا</p></div>
    <button class="btn" id="addBtn">+ أضف نفسك</button>
  </div>
  <p class="conn" id="conn"></p>
  <div class="stats" id="stats"></div>
  <div class="row" style="margin-bottom:6px"><input class="search" id="aiq" placeholder="🤖 بحث ذكي: اكتبي بكلامك، مثلاً: بدي دكتورة نسائية بإسطنبول بالفاتح"><button class="btn" id="aiBtn">بحث ذكي</button></div><p class="conn" id="aiMsg" style="margin:0 0 10px"></p>
  <div class="row">
    <input class="search" id="q" placeholder="ابحث بالاسم أو التخصص أو المنطقة...">
    <select class="sort" id="sort"><option value="rate">الأعلى تقييماً</option><option value="new">الأحدث</option></select>
  </div>
  <div class="lbl">نوع الخدمة</div><div class="chips" id="svcChips"></div>
  <div class="lbl">المدينة</div><div class="chips" id="cityChips"></div>
  <div id="areaBox" style="display:none"><div class="lbl">المنطقة</div><div class="chips" id="areaChips"></div></div>
</div></header>

<div class="form" id="form">
  <h2>سجّل نفسك بالدليل</h2>
  <p class="note" style="margin:0 0 16px">كل بروفايل جديد بيمرّ بمراجعة قبل ما ياخد علامة "موثّق".</p>
  <form id="reg">
    <div class="f"><label>الاسم</label><input id="f_n" required></div>
    <div class="f2"><div class="f"><label>نوع الخدمة</label><select id="f_s"></select></div>
    <div class="f"><label>المسمى</label><input id="f_r" required placeholder="مثال: طبيب عام"></div></div>
    <div class="f2"><div class="f"><label>المدينة</label><input id="f_c" list="cl" required><datalist id="cl"></datalist></div>
    <div class="f"><label>المنطقة</label><input id="f_a" required></div></div>
    <div class="f2"><div class="f"><label>اللغات / الأنواع</label><input id="f_l" placeholder="عربي، تركي"></div>
    <div class="f"><label>الخبرة / التفاصيل</label><input id="f_e"></div></div>
    <div class="f"><label>رقم واتساب (مع رمز الدولة، مثال 905xxxxxxxxx)</label><input id="f_p" inputmode="tel"></div>
    <div class="f"><label>نبذة</label><textarea id="f_b" rows="3"></textarea></div>
    <button class="go" type="submit">نشر بروفايلي</button>
  </form>
</div>

<main><div class="wrap">
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty"><h3>لا توجد نتائج</h3><p>جرّب تغيير الفلاتر</p></div>
</div></main>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script>
const API_BASE="https://topluluk-1.onrender.com/api";
const SV={"أطباء":["🩺","doctors"],"أساتذة":["📚","teachers"],"ممرضون":["💉","nurses"],"مكاتب عقارية":["🏠","real_estate"],"محامون ومترجمون":["⚖️","legal"],"مطاعم ومحلات":["🍽️","shops"]};
const ALL="الكل";
const P=(n,r,s,c,a,l,e,b,rt,rv,v)=>({name:n,role:r,service:s,city:c,area:a,lang:l,experience:e,bio:b,rating:rt,reviews:rv,verified:v,phone:""});
// بيانات تجريبية وهمية
const DEMO=[
P("د. سامر الحلبي","طبيب أطفال","أطباء","إسطنبول","الفاتح","عربي، تركي","12 سنة خبرة","استشاري أطفال يستقبل حالات حديثي الولادة والأطفال حتى 14 سنة.",4.8,36,true),
P("د. لينا مارديني","طبيبة نسائية وتوليد","أطباء","إسطنبول","إسنيورت","عربي، تركي، إنجليزي","15 سنة خبرة","متابعة حمل وولادة وفحوصات دورية.",4.9,52,true),
P("د. عمر النجار","طبيب أسنان","أطباء","غازي عنتاب","الشهيد كامل","عربي، تركي","10 سنوات خبرة","علاج جذور وتقويم وزراعة أسنان.",4.6,28,true),
P("د. هبة رمضان","طبيبة جلدية","أطباء","أنقرة","كيتشيورن","عربي، تركي","11 سنة خبرة","علاج حب الشباب والحساسية الجلدية.",4.5,19,false),
P("أ. رهف قدور","أستاذة رياضيات","أساتذة","إسطنبول","بشيكتاش","عربي، إنجليزي","8 سنوات خبرة","تدريس خصوصي إعدادي وثانوي وتحضير امتحانات.",4.7,24,true),
P("أ. بلال شحادة","أستاذ لغة عربية وتركية","أساتذة","أنقرة","تشانكايا","عربي، تركي","5 سنوات خبرة","دروس تركية من الصفر ولغة عربية للأطفال.",4.4,15,false),
P("أ. نور الدين حسن","أستاذ فيزياء وكيمياء","أساتذة","غازي عنتاب","شاهين بك","عربي، إنجليزي","9 سنوات خبرة","تحضير طلاب الثانوية للقبول الجامعي.",4.8,31,true),
P("م. ياسمين عودة","ممرضة عناية مركزة","ممرضون","بورصة","نيلوفار","عربي، تركي","6 سنوات خبرة","رعاية مسنين وما بعد العمليات، زيارات منزلية.",4.7,17,true),
P("م. خالد الأحمد","ممرض طوارئ","ممرضون","إزمير","كوناك","عربي، تركي","7 سنوات خبرة","إسعافات أولية وتدريب أهالي على رعاية المرضى.",4.3,9,false),
P("مكتب الشام العقاري","مكتب عقارات","مكاتب عقارية","إسطنبول","إسنيورت","بيوت، شقق، أراضي","بيع وإيجار","وساطة عقارية ومتابعة معاملات الطابو.",4.5,22,true),
P("مكتب الياسمين للعقارات","مكتب عقارات","مكاتب عقارية","غازي عنتاب","الشهيد كامل","فلل، بيوت، محلات","بيع وإيجار","فلل وعقارات فاخرة مع معاينة مباشرة.",4.6,14,false),
P("مكتب دمشق العقاري","مكتب عقارات","مكاتب عقارية","أنقرة","تشانكايا","أراضي، شقق استثمارية","استثمار عقاري","أراضي واستثمار عقاري للمقيمين العرب.",4.2,8,false),
P("المحامي ماجد الخطيب","محامي إقامة وجنسية","محامون ومترجمون","إسطنبول","شيشلي","عربي، تركي","14 سنة خبرة","معاملات الإقامة والجنسية والعقود والتأسيس.",4.7,41,true),
P("مكتب الأمانة للترجمة","ترجمة محلفة","محامون ومترجمون","غازي عنتاب","شاهين بك","عربي، تركي، إنجليزي","ترجمة معتمدة","ترجمة وثائق رسمية مع ختم النوتر.",4.6,33,true),
P("مطعم ياسمين الشام","مطعم مأكولات شامية","مطاعم ومحلات","إسطنبول","أكسراي","مأكولات شامية","توصيل متوفر","مشاوي وأطباق شامية وحلويات.",4.4,120,false),
P("سوبرماركت الأصالة","مواد غذائية عربية","مطاعم ومحلات","أنقرة","ألتيندغ","منتجات عربية","توصيل متوفر","بقالة ومنتجات عربية مستوردة.",4.1,37,false)
].map((p,i)=>({...p,id:"m"+i,ts:i}));
let DATA=[],loading=true;

const load=k=>{try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(e){return[]}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let favs=new Set(load("cd_favs"));
let st={svc:ALL,city:ALL,area:ALL,q:"",sort:"rate",fav:false},usingBackend=false;
const $=id=>document.getElementById(id);
const cities=()=>[ALL,...new Set(DATA.map(d=>d.city))];
const areas=c=>[ALL,...new Set(DATA.filter(d=>d.city===c).map(d=>d.area))];
const key=p=>p.name+"|"+p.city;

function chips(id,items,cur,fn,fmt=x=>x){const el=$(id);el.innerHTML="";items.forEach(i=>{const b=document.createElement("button");b.className="chip"+(i===cur?" on":"");b.textContent=fmt(i);b.onclick=()=>fn(i);el.appendChild(b)})}
const stars=p=>p.reviews?`<div class="stars">${"★".repeat(Math.round(p.rating))}${"☆".repeat(5-Math.round(p.rating))} <small>${p.rating} (${p.reviews} تقييم)</small></div>`:`<div class="stars"><small>جديد على الدليل</small></div>`;

function render(){
  chips("svcChips",[ALL,"❤ المفضلة",...Object.keys(SV)],st.fav?"❤ المفضلة":st.svc,v=>{if(v==="❤ المفضلة"){st.fav=!st.fav}else{st.fav=false;st.svc=v}render()},v=>SV[v]?SV[v][0]+" "+v:v);
  chips("cityChips",cities(),st.city,v=>{st.city=v;st.area=ALL;render()});
  $("areaBox").style.display=st.city===ALL?"none":"block";
  if(st.city!==ALL)chips("areaChips",areas(st.city),st.area,v=>{st.area=v;render()});
  const q=st.q.trim();
  let r=DATA.filter(p=>(st.svc===ALL||p.service===st.svc)&&(st.city===ALL||p.city===st.city)&&(st.area===ALL||p.area===st.area)&&(!st.fav||favs.has(key(p)))&&(!q||[p.name,p.role,p.area,p.city].some(x=>x.includes(q))));
  r.sort((a,b)=>st.sort==="rate"?(b.rating||0)-(a.rating||0)||b.reviews-a.reviews:b.ts-a.ts);
  $("count").textContent=r.length+" نتيجة";
  $("empty").innerHTML=loading?"<h3>⏳ جاري تحميل البيانات...</h3><p>السيرفر المجاني ممكن ياخد حتى دقيقة ليصحى</p>":"<h3>لا توجد نتائج</h3><p>جرّب تغيير الفلاتر</p>";
  $("empty").style.display=r.length?"none":"block";
  const g=$("grid");g.innerHTML="";
  r.forEach(p=>{const c=document.createElement("div");c.className="card";c.tabIndex=0;
    c.innerHTML=`<button class="fav${favs.has(key(p))?" on":""}" aria-label="مفضلة">${favs.has(key(p))?"♥":"♡"}</button>
    <div class="ch"><div class="av">${SV[p.service]?SV[p.service][0]:"👤"}</div><div><h3 class="nm">${esc(p.name)}${p.verified?'<span class="vf">✓ موثّق</span>':""}</h3><p class="rl">${esc(p.role)}</p></div></div>
    ${stars(p)}<div class="meta"><span>📍 ${esc(p.city)} — ${esc(p.area)}</span><span>🗣️ ${esc(p.lang)}</span></div>`;
    c.querySelector(".fav").onclick=e=>{e.stopPropagation();favs.has(key(p))?favs.delete(key(p)):favs.add(key(p));save("cd_favs",[...favs]);render()};
    c.onclick=()=>openSheet(p);c.onkeydown=e=>{if(e.key==="Enter")openSheet(p)};g.appendChild(c)});
  $("stats").innerHTML=`<div class="stat"><b>${DATA.length}</b><span>مقدّم خدمة</span></div><div class="stat"><b>${cities().length-1}</b><span>مدينة</span></div><div class="stat"><b>${DATA.filter(d=>d.verified).length}</b><span>موثّق</span></div><div class="stat"><b>${Object.keys(SV).length}</b><span>تصنيف</span></div>`;
}

function openSheet(p){
  const ph=(p.phone||"").replace(/\D/g,"");
  $("sheet").innerHTML=`<button class="x" onclick="closeSheet()" aria-label="إغلاق">✕</button>
  <h2 style="margin:0">${esc(p.name)} ${p.verified?'<span class="vf">✓ موثّق</span>':""}</h2><p class="rl">${SV[p.service]?SV[p.service][0]:""} ${esc(p.service)} — ${esc(p.role)}</p>${stars(p)}
  <div class="sm"><div><b>الموقع</b>${esc(p.city)} — ${esc(p.area)}</div><div><b>اللغات</b>${esc(p.lang)}</div><div><b>التفاصيل</b>${esc(p.experience)}</div></div>
  <p>${esc(p.bio)}</p>
  <div class="acts"><a class="act wa${ph?"":" off"}" ${ph?`href="https://wa.me/${ph}" target="_blank" rel="noopener"`:""}>واتساب</a><a class="act call${ph?"":" off"}" ${ph?`href="tel:+${ph}"`:""}>اتصال</a></div>
  ${ph?"":'<p class="note">هاي بيانات تجريبية — التواصل متاح للبروفايلات الحقيقية.</p>'}
  <p class="note">تنبيه: تحققي من الترخيص والتوثيق بنفسك قبل التعامل، خصوصاً بالخدمات الطبية والقانونية والعقارية.</p>`;
  $("ov").classList.add("open");
}
function closeSheet(){$("ov").classList.remove("open")}
$("ov").onclick=e=>{if(e.target.id==="ov")closeSheet()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
$("q").oninput=e=>{st.q=e.target.value;render()};
$("sort").onchange=e=>{st.sort=e.target.value;render()};

// فورم الإضافة
$("f_s").innerHTML=Object.keys(SV).map(s=>`<option>${s}</option>`).join("");
$("addBtn").onclick=()=>{const o=!$("form").classList.contains("open");$("form").classList.toggle("open",o);document.querySelector("main").style.display=o?"none":"block";$("addBtn").textContent=o?"✕ إغلاق":"+ أضف نفسك";if(o)$("cl").innerHTML=cities().filter(c=>c!==ALL).map(c=>`<option value="${esc(c)}">`).join("")};

$("reg").onsubmit=async e=>{e.preventDefault();
  const p={id:"u"+Date.now(),ts:Date.now(),name:$("f_n").value.trim(),role:$("f_r").value.trim(),service:$("f_s").value,city:$("f_c").value.trim(),area:$("f_a").value.trim(),lang:$("f_l").value.trim()||"عربي",experience:$("f_e").value.trim()||"—",bio:$("f_b").value.trim()||"لا يوجد وصف بعد.",phone:$("f_p").value.trim(),rating:0,reviews:0,verified:false};
  let sent=false;
  if(usingBackend){try{const r=await fetch(API_BASE+"/profiles",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({full_name:p.name,headline:p.role,service_slug:SV[p.service][1],city_name:p.city,area_name:p.area,languages:p.lang,bio:p.bio,phone:p.phone,details:{}})});sent=r.ok}catch(_){}
    if(sent){alert("تم الإرسال للمراجعة والتوثيق ✅");await tryBackend()}}
  if(!sent){DATA.unshift(p);const s=load("cd_profiles");s.unshift(p);save("cd_profiles",s)}
  e.target.reset();$("addBtn").click();st={...st,svc:ALL,city:ALL,area:ALL,q:"",fav:false};$("q").value="";render()};

// اتصال اختياري بالـ backend
async function tryBackend(){
  $("conn").textContent="⏳ جاري الاتصال بالسيرفر... (أول مرة ممكن ياخد دقيقة)";
  try{const r=await fetch(API_BASE+"/profiles",{signal:AbortSignal.timeout(75000)});if(!r.ok)throw 0;const j=await r.json();
    DATA=j.results.map((x,i)=>{const d=x.details||{};return{id:x.id,ts:-i,name:x.full_name,role:x.headline,service:x.service,city:x.city,area:x.area,lang:x.languages||"—",experience:d.years_experience?d.years_experience+" سنة خبرة":(d.deal_type||"—"),bio:x.bio||"",phone:x.phone||"",rating:0,reviews:0,verified:x.verification_status==="verified"}});
    usingBackend=true;$("conn").textContent="🟢 متصل بالسيرفر — بيانات حقيقية ومشتركة"}
  catch(_){usingBackend=false;DATA=[...load("cd_profiles"),...DEMO];$("conn").textContent="⚪ وضع تجريبي محلي — بيانات وهمية، وما في سيرفر متصل"}
  loading=false;render()}
// البحث الذكي
$("aiBtn").onclick=async()=>{
  const t=$("aiq").value.trim(),m=$("aiMsg");
  if(!t){m.textContent="اكتبي جملة للبحث أول.";return}
  if(!usingBackend){m.textContent="البحث الذكي بيحتاج اتصال بالسيرفر. استني لحد ما يظهر 🟢 متصل.";return}
  m.textContent="⏳ عم أفهم طلبك...";$("aiBtn").disabled=true;
  try{
    const r=await fetch(API_BASE+"/smart-search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t}),signal:AbortSignal.timeout(30000)});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||"صار خطأ");
    st={...st,svc:d.service||ALL,city:d.city||ALL,area:d.area||ALL,q:d.keyword||"",fav:false};
    $("q").value=st.q;
    const parts=[d.service,d.city,d.area,d.keyword].filter(Boolean);
    m.textContent=parts.length?"فهمت: "+parts.join(" • "):"ما قدرت أحدد فلاتر، جرّبي توضحي أكتر.";
    render();
  }catch(e){m.textContent="⚠️ "+(e.message||"صار خطأ")+" — جرّبي مرة تانية."}
  $("aiBtn").disabled=false;
};
$("aiq").addEventListener("keydown",e=>{if(e.key==="Enter")$("aiBtn").click()});

render();tryBackend();
</script>
